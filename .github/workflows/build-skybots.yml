name: Build SkyBots

on:
  push:
    paths:
      - 'SkyBots/**'
      - '.github/workflows/build-skybots.yml'
  pull_request:
    paths:
      - 'SkyBots/**'
      - '.github/workflows/build-skybots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SkyBots JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SkyBots
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Build plugin
        run: gradle build --no-daemon
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: SkyBots-JAR
          path: SkyBots/build/libs/SkyBots-*.jar
          if-no-files-found: error
          retention-days: 14

